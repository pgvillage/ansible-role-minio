---
# Tests the role on Rocky Linux 9 and 10 in systemd containers, with
# minio_use_rustfs: the MinIO community binaries are no longer published, so
# the role installs RustFS and rc from the pgvillage package repo instead
# (see prepare.yml).
dependency:
  name: galaxy
  options:
    requirements-file: ${MOLECULE_SCENARIO_DIRECTORY}/requirements.yml
driver:
  name: podman
platforms:
  - name: minio-el9
    image: docker.io/geerlingguy/docker-rockylinux9-ansible:latest
    pre_build_image: true
    command: /usr/sbin/init
    systemd: always
  - name: minio-el10
    image: docker.io/geerlingguy/docker-rockylinux10-ansible:latest
    pre_build_image: true
    command: /usr/sbin/init
    systemd: always
    # systemd 257 fails to set up the unit's sandboxing (ProtectHome,
    # PrivateTmp, ...) in an unprivileged container
    privileged: true
provisioner:
  name: ansible
verifier:
  name: ansible
scenario:
  test_sequence:
    - dependency
    - destroy
    - syntax
    - create
    - prepare
    - converge
    - idempotence
    - verify
    - destroy
