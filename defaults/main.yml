---
# State of the Minio packages and the Minio group (`present` or `absent`)
minio_package_state: present

# Packages to install: the Minio server and the Minio client (mcli)
minio_package_names:
  - minio
  - mcli

# Path to the Minio server binary (used by the systemd unit and init.d script)
minio_server_bin: "/usr/local/bin/minio"

# Path to the Minio client binary (used to create buckets)
minio_client_bin: "/usr/local/bin/mcli"

# Name of the Minio server service (systemd unit / init.d script)
minio_service_name: minio

# Replace Minio by RustFS. When true, the role stops and removes Minio (the
# data directories are kept) and installs and configures RustFS with the same
# user, data directories, addresses, credentials and certificates.
minio_use_rustfs: false

# RustFS packages to install: the RustFS server and the RustFS client (rc)
minio_rustfs_package_names:
  - rustfs
  - rc

# Path to the RustFS server binary (used by the systemd unit)
minio_rustfs_server_bin: "/usr/bin/rustfs"

# Path to the RustFS client binary
minio_rustfs_client_bin: "/usr/bin/rc"

# Name of the RustFS server service (systemd unit)
minio_rustfs_service_name: rustfs

# Runtime user and group for the Minio server service
minio_user: minio
minio_group: "{{ minio_user }}"

# Path to the file containing the ENV variables for the Minio server
minio_server_envfile: /etc/default/minio

# Minio server listen address (`[host]:port`).
# Ports below 1024 grant CAP_NET_BIND_SERVICE to the systemd service.
minio_server_addr: ":9091"

# Minio server console (web UI) listen address (`[host]:port`).
# Ports below 1024 grant CAP_NET_BIND_SERVICE to the systemd service.
minio_server_console_addr: ":9001"

# Minio server data directories. Created by the role and used as MINIO_VOLUMES
# when `minio_server_cluster_nodes` is empty.
minio_server_datadirs:
  - "/var/lib/minio"

# Minio server cluster node list (e.g. `https://minio{1...4}/var/lib/minio`).
# When set, it is used as MINIO_VOLUMES instead of `minio_server_datadirs`.
minio_server_cluster_nodes: []

# Additional environment variables to be set in minio server environment.
# Added verbatim to `minio_server_envfile`, e.g. "MINIO_BROWSER=off".
minio_server_env_extra: ""

# Additional Minio server CLI options (appended to MINIO_OPTS)
minio_server_opts: ""

# Path to the file containing the ENV variables for the RustFS server
minio_rustfs_server_envfile: /etc/default/rustfs

# Additional environment variables to be set in the RustFS server environment.
# Added verbatim to `minio_rustfs_server_envfile`,
# e.g. "RUSTFS_REGION=eu-west-1".
minio_rustfs_env_extra: ""

# Minio access and secret keys. Set as MINIO_ROOT_USER / MINIO_ROOT_PASSWORD
# for the server, and used by the client to connect. Override these!
minio_access_key: "AWSKEY"
minio_secret_key: "AWSSECRET"

# Internal: default client endpoint config, merged with `minio_endpoint`
__minio_endpoint_defaults:
  accessKey: "{{ minio_access_key }}"
  secretKey: "{{ minio_secret_key }}"
  url: "https://{{ ansible_facts.fqdn }}"
  api: S3v4
  path: auto

# Overrides for the client endpoint config (keys: accessKey, secretKey, url,
# api, path). Merged on top of `__minio_endpoint_defaults` and used for the
# mcli `minio` alias and for the startup health check.
minio_endpoint: {}

# Buckets to create (with mcli) after Minio has started
minio_buckets:
  - mybucket

# Config directories of the Minio client and server (in the home dir of `minio_user`)
minio_client_configdir: "{{ getent_passwd[minio_user][4] }}/.mcli"
minio_server_configdir: "{{ getent_passwd[minio_user][4] }}/.minio"

# Directory with the RustFS server certificate and key (`rustfs_cert.pem` and
# `rustfs_key.pem`), set as RUSTFS_TLS_PATH
minio_rustfs_tls_path: "{{ minio_server_configdir }}/certs"

# Config directory of the RustFS client (rc), in the home dir of `minio_user`
minio_rustfs_client_configdir: "{{ getent_passwd[minio_user][4] }}/.config/rc"
# CA bundle (PEM) used by rc to verify the server certificate. Defaults to
# the client CA chain deployed from `minio_client_cert` (`minio_chain` in
# `minio_cert_files`); empty means the system CAs.
minio_rustfs_client_ca_bundle: >-
  {{ minio_cert_files.minio_chain.path if minio_cert_from_string | bool
     else '' }}
# Options added to rc commands (e.g. when creating buckets). With
# `minio_insecure`, rc skips TLS verification through its alias config.
minio_rustfs_cli_options: "--ignore-existing"

# Whether certificates are managed (e.g. by chainsmith). When true, the role
# asserts that `minio_client_cert`, `minio_server_cert`, `minio_server_key`
# and `minio_server_chain` contain multi-line values.
minio_cert_managed: true
# Deploy certs from the `body` strings in `minio_cert_files` (true), or copy
# them from the `source` files in `minio_cert_files` (false)
minio_cert_from_string: "{{ minio_cert_managed }}"
# When copying certs from file: `source` is on the managed host (true) or on
# the Ansible controller (false)
minio_cert_remote: "{{ not minio_cert_from_string }}"

# Pass `--insecure` to mcli (skip TLS certificate verification)
minio_insecure: false
# Options added to mcli commands (e.g. when creating buckets)
minio_cli_options: "--ignore-existing {% if minio_insecure %} --insecure{% endif %}"

# Directories to create for certificates (key: name, value: path and owner)
minio_cert_folders:
  client:
    path: "{{ minio_client_configdir }}/certs/CAs/"
    owner: "{{ minio_user }}"
  server:
    path: "{{ minio_server_configdir }}/certs"
    owner: "{{ minio_user }}"

# Certificate data (PEM) used when `minio_cert_from_string` is true:
# CA chain trusted by the client, server certificate, server private key
# and server CA chain
minio_client_cert: "---- CERT ----"
minio_server_cert: "---- CERT ----"
minio_server_key: "---- KEY ----"
minio_server_chain: "---- CHAIN ----"

# Certificate files to deploy. Each entry has a destination `path`, an
# `owner`, the `body` (used when `minio_cert_from_string` is true) and an
# optional `source` file (used when `minio_cert_from_string` is false)
minio_cert_files:
  minio_chain:
    path: "{{ minio_cert_folders.client.path }}/CA_{{ ansible_facts.hostname }}.crt"
    body: "{{ minio_client_cert }}"
    owner: "{{ minio_user }}"
  server_cert:
    path: "{{ minio_cert_folders.server.path }}/public.crt"
    body: "{{ minio_server_cert }}"
    owner: "{{ minio_cert_folders.server.owner }}"
    source: "/etc/pki/minio/server.crt"
  server_key:
    path: "{{ minio_cert_folders.server.path }}/private.key"
    body: "{{ minio_server_key }}"
    owner: "{{ minio_cert_folders.server.owner }}"
    source: "/etc/pki/minio/server.key"
  server_chain:
    path: "{{ minio_cert_folders.server.path }}/ca.pem"
    body: "{{ minio_server_chain }}"
    owner: "{{ minio_cert_folders.server.owner }}"
    source: "/etc/pki/minio/root.crt"

# RustFS certificate files, deployed in addition to `minio_cert_files` when
# `minio_use_rustfs` is true. Same keys as `minio_cert_files`.
minio_rustfs_cert_files:
  rustfs_cert:
    path: "{{ minio_rustfs_tls_path }}/rustfs_cert.pem"
    body: "{{ minio_server_cert }}"
    owner: "{{ minio_user }}"
    source: "/etc/pki/minio/server.crt"
  rustfs_key:
    path: "{{ minio_rustfs_tls_path }}/rustfs_key.pem"
    body: "{{ minio_server_key }}"
    owner: "{{ minio_user }}"
    source: "/etc/pki/minio/server.key"

# Internal: service, cert folders and cert files for Minio or RustFS
__minio_service_name: >-
  {{ minio_rustfs_service_name if minio_use_rustfs | bool
     else minio_service_name }}
__minio_cert_folders: >-
  {{ minio_cert_folders | combine({'rustfs': {'path': minio_rustfs_tls_path,
     'owner': minio_user}} if minio_use_rustfs | bool else {}) }}
__minio_cert_files: >-
  {{ minio_cert_files | combine(minio_rustfs_cert_files
     if minio_use_rustfs | bool else {}) }}
