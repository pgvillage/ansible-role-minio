---
- name: Checking for valid certs config
  ansible.builtin.assert:
    that:
      - "'\n' in minio_client_cert"
      - "'\n' in minio_server_cert"
      - "'\n' in minio_server_key"
      - "'\n' in minio_server_chain"
    fail_msg: "Please run chainsmith to succesfully setup certs"
    success_msg: "Client and server certs seem properly setup"
  when: minio_cert_managed

- name: Create minio user, group and data directories
  ansible.builtin.include_tasks: create.yml
- name: Get user info
  ansible.builtin.getent:
    database: passwd
    key: "{{ minio_user }}"
    split: ":"
- name: Install, configure and start minio
  when: not minio_use_rustfs | bool
  block:
    - name: Install minio
      ansible.builtin.include_tasks: install.yml
    - name: Deploy certificates for minio
      ansible.builtin.include_tasks: certs.yml
    - name: Start minio
      ansible.builtin.include_tasks: start.yml
    - name: Configure minio client and create buckets
      ansible.builtin.include_tasks: config_client.yml
- name: Replace minio by rustfs
  when: minio_use_rustfs | bool
  block:
    - name: Remove minio (data directories are kept)
      ansible.builtin.include_tasks: remove_minio.yml
    - name: Install rustfs
      ansible.builtin.include_tasks: rustfs_install.yml
    - name: Deploy certificates for rustfs
      ansible.builtin.include_tasks: certs.yml
    - name: Start rustfs
      ansible.builtin.include_tasks: start.yml
    - name: Configure rustfs client and create buckets
      ansible.builtin.include_tasks: rustfs_client.yml
