---
# Switching from RustFS back to Minio is not supported: Minio only reads
# `.minio.sys` and would miss everything created or changed under RustFS.
# Fail before touching anything when RustFS is or was in use on this host.

- name: Gather service facts
  ansible.builtin.service_facts:

- name: Look for RustFS files
  ansible.builtin.stat:
    path: "{{ item }}"
  loop: >-
    {{ ['/etc/systemd/system/' ~ minio_rustfs_service_name ~ '.service',
        minio_rustfs_server_envfile]
       + minio_server_datadirs | map('regex_replace', '/+$', '')
         | map('regex_replace', '$', '/.rustfs.sys') }}
  register: minio_rustfs_files

- name: Check that RustFS is not in use on this host
  ansible.builtin.assert:
    that:
      - not minio_rustfs_service_exists
      - minio_rustfs_found | length == 0
    fail_msg: >-
      RustFS is or was in use on this host ({{ minio_rustfs_found | join(', ')
      | default('service ' ~ minio_rustfs_service_name, true) }}) but
      minio_use_rustfs is false. Switching back from RustFS to Minio is not
      supported: Minio would not see buckets, users or policies created or
      changed under RustFS. Keep minio_use_rustfs set to true, or move to the
      pgvillage.rustfs role.
    quiet: true
  vars:
    # systemd also reports units that are referenced but not installed
    minio_rustfs_service_exists: >-
      {{ ansible_facts.services | default({}) | dict2items
         | selectattr('key', 'in', [minio_rustfs_service_name,
                                    minio_rustfs_service_name ~ '.service'])
         | rejectattr('value.status', 'eq', 'not-found')
         | list | length > 0 }}
    minio_rustfs_found: >-
      {{ minio_rustfs_files.results | selectattr('stat.exists')
         | map(attribute='item') | list }}
